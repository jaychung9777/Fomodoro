<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcebd8" id="themeColor">
<meta name="description" content="Fomodoro — 집중과 휴식을 위한 타이머">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fomodoro</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dcebd8;--bg2:#eaf4e5;--card:rgba(255,255,255,.62);--ink:#264a33;--sub:#5d7f68;--acc:#3f7a50;--vine:#3f7a50;--line:#b9d4bf;--inp:rgba(255,255,255,.55)}

:root[data-theme="dark"]{color-scheme:dark;--bg:#1d2f24;--bg2:#27402f;--card:rgba(20,36,26,.7);--ink:#e1f0e3;--sub:#9cbca6;--acc:#78c28d;--vine:#9fd6ac;--line:#3d5c48;--inp:rgba(0,0,0,.25)}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;transition:background 1.2s;overflow-x:hidden}
body.rest{background:var(--bg2);--acc:#6fae82}
#vine{position:fixed;inset:0;width:100%;height:100%;opacity:.20;pointer-events:none;color:var(--vine)}
.themebar{display:flex;justify-content:center;margin:-6px 0 14px}.themebar button{font-size:13px;padding:9px 14px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 12px rgba(20,60,30,.08)}
.card{box-shadow:0 8px 24px rgba(22,65,35,.06)}
:root[data-theme="dark"] .card{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;margin:6px 0 18px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px;backdrop-filter:blur(6px)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
.card h2 span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;margin-right:8px}
input[type=text],input[type=number],input[type=url]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;font-size:16px}
.row{display:flex;gap:10px;align-items:center}
.row label{font-size:14px;color:var(--sub)}
.t{display:flex;align-items:center;gap:6px}.t input{width:84px;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.step{width:44px;height:44px;border-radius:50%;padding:0;font-size:22px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--acc)}
.dia{display:flex;align-items:center;gap:14px}
.dia svg{width:150px;flex:none}
input[type=range]{width:100%;accent-color:#3f7a50}
.sum{font-size:13px;color:var(--sub);text-align:center;margin:8px 0 16px}
.big{width:100%;font-size:18px;padding:16px}
small{color:var(--sub);font-size:12px}
#timer{display:none;text-align:center;padding-top:30px}
#ring{width:min(78vw,340px);margin:20px auto 10px;display:block}
#tm{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;position:relative;z-index:60}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:50}
#bgm{position:fixed!important;left:-10000px!important;top:0!important;width:1px!important;height:1px!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important;z-index:-9999!important;overflow:hidden!important;clip-path:inset(50%)!important}
#bgm:empty{display:none}
#bgm iframe{position:absolute!important;left:0!important;top:0!important;display:block!important;width:1px!important;height:1px!important;min-width:1px!important;min-height:1px!important;border:0!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}
</style></head><body>
<svg id="vine" aria-hidden="true"><defs><pattern id="p" width="112" height="112" patternUnits="userSpaceOnUse"><g fill="currentColor"><g transform="translate(28 28)"><path d="M0 0C-19 -25 -34 -9 -23 5C-16 14 -6 9 0 0Z"/><path d="M0 0C19 -25 34 -9 23 5C16 14 6 9 0 0Z"/><path d="M0 0C-19 25 -34 9 -23 -5C-16 -14 -6 -9 0 0Z"/><path d="M0 0C19 25 34 9 23 -5C16 -14 6 -9 0 0Z"/><circle r="3"/></g><g transform="translate(84 84) scale(.78)"><path d="M0 0C-19 -25 -34 -9 -23 5C-16 14 -6 9 0 0Z"/><path d="M0 0C19 -25 34 -9 23 5C16 14 6 9 0 0Z"/><path d="M0 0C-19 25 -34 9 -23 -5C-16 -14 -6 -9 0 0Z"/><path d="M0 0C19 25 34 9 23 -5C16 -14 6 -9 0 0Z"/><circle r="3"/></g></g></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>

<div class="wrap" id="setup">
<h1>🌿 Fomodoro</h1>
<div class="themebar"><button id="themeSetup" type="button">🌙 다크 모드로 전환</button></div>
<div class="card"><h2><span>1</span>이름</h2><input type="text" id="nm" placeholder="이름을 입력해 주세요" maxlength="20"></div>

<div class="card"><h2><span>2</span>세트 시간</h2>
<div class="row" style="justify-content:center"><div class="t"><input type="number" id="hh" min="0" max="12" value="1" inputmode="numeric"><label>시간</label></div><div class="t"><input type="number" id="mm" min="0" max="59" step="5" value="0" inputmode="numeric"><label>분</label></div></div>
<small style="display:block;text-align:center;margin-top:8px">한 세트의 집중 + 휴식 합계 (최소 10분)</small></div>

<div class="card"><h2><span>3</span>세트 반복</h2>
<div class="row" style="justify-content:center;gap:24px"><button class="step" id="rm">−</button><div style="font-size:26px;font-weight:700;min-width:70px;text-align:center"><span id="rc">1</span> 세트</div><button class="step" id="rp">+</button></div>
<div class="dots" id="dots"></div></div>

<div class="card"><h2><span>4</span>집중 : 휴식</h2>
<div class="dia"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="62" fill="none" stroke="#bfe0c8" stroke-width="22"/><circle id="arc" cx="80" cy="80" r="62" fill="none" stroke="#3f7a50" stroke-width="22" transform="rotate(-90 80 80)" stroke-dasharray="0 400"/><text x="80" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor" id="dr">50:10</text><text x="80" y="98" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">집중 : 휴식</text></svg>
<div style="flex:1"><input type="range" id="rg" min="5" max="55" step="5" value="50"><div class="row" style="margin-top:8px;font-size:14px;justify-content:space-between"><div>🟢 집중 <b id="fv">50</b>분</div><div>⚪ 휴식 <b id="rv">10</b>분</div></div></div></div></div>

<div class="card"><h2><span>5</span>배경음</h2>
<div style="margin-bottom:10px"><label style="font-size:13px;color:var(--sub)">집중 시간 (YouTube 또는 음악 링크)</label><input type="url" id="fu" placeholder="https://youtu.be/..."></div>
<div><label style="font-size:13px;color:var(--sub)">휴식 시간 (YouTube 또는 음악 링크)</label><input type="url" id="ru" placeholder="https://youtu.be/..."></div>
<small style="display:block;margin-top:8px">비워 두면 해당 시간에는 배경음이 재생되지 않아요.</small></div>

<div class="sum" id="sum"></div>
<button class="big" id="go">설정 완료 · 시작하기</button>
</div>

<div class="wrap" id="timer">
<div class="themebar"><button id="themeTimer" type="button">🌙 다크 모드로 전환</button></div>
<div id="who" style="color:var(--sub);font-size:15px"></div>
<div id="ph" style="font-size:26px;font-weight:700;margin-top:6px"></div>
<svg id="ring" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="pr" cx="100" cy="100" r="88" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="553 553"/><foreignObject x="20" y="62" width="160" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center"><div id="tm">00:00</div><div id="st" style="font-size:14px;opacity:.7"></div></div></foreignObject></svg>
<div class="ctl"><button id="pa">일시정지</button><button class="g" id="bgmToggle" aria-pressed="false">배경음 켜기</button><button class="g" id="en">끝내기</button><button class="g" id="fs">전체화면</button><button class="g" id="dm">화면 어둡게</button></div>
<div id="bgm" aria-hidden="true"></div>
</div>
<div id="dim"></div>

<script>
const $=i=>document.getElementById(i);
let reps=1,ctx;
function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('fomodoro-theme',theme);const dark=theme==='dark';['themeSetup','themeTimer'].forEach(id=>{const b=$(id);if(b)b.textContent=dark?'☀️ 기본 모드로 전환':'🌙 다크 모드로 전환'});const m=$('themeColor');if(m)m.content=dark?'#1d2f24':'#dcebd8'}
applyTheme(localStorage.getItem('fomodoro-theme')==='dark'?'dark':'light');
$('themeSetup').onclick=$('themeTimer').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function total(){return Math.max(10,(+$('hh').value||0)*60+(+$('mm').value||0))}
function upd(){
 const T=total(),rg=$('rg');rg.max=Math.max(5,Math.floor((T-1)/5)*5);
 if(+rg.value>+rg.max)rg.value=rg.max;
 const f=+rg.value,r=T-f;$('fv').textContent=f;$('rv').textContent=r;
 $('dr').textContent=f+':'+r;
 const C=2*Math.PI*62;$('arc').setAttribute('stroke-dasharray',(C*f/T)+' '+C);
 $('rc').textContent=reps;
 $('dots').innerHTML=Array.from({length:Math.min(reps,24)},()=>'<i></i>').join('');
 const all=T*reps;$('sum').textContent='총 '+(all>=60?Math.floor(all/60)+'시간 ':'')+(all%60?all%60+'분':'')+' · '+reps+'세트';
}
['hh','mm','rg'].forEach(i=>$(i).addEventListener('input',upd));
$('rm').onclick=()=>{reps=Math.max(1,reps-1);upd()};
$('rp').onclick=()=>{reps=Math.min(99,reps+1);upd()};
upd();

function noise(t,d,fq,g,q){const n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q;const v=ctx.createGain();v.gain.value=g;s.connect(f);f.connect(v);v.connect(ctx.destination);s.start(t)}
function tone(t,fq,d,g){const o=ctx.createOscillator(),v=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(fq,t);o.frequency.exponentialRampToValueAtTime(fq*.6,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+d)}
let tk=0;function tick(){if(!ctx)return;const t=ctx.currentTime;tk^=1;noise(t,.012,tk?4200:3300,.5,6);const o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';o.frequency.value=tk?2100:1650;v.gain.setValueAtTime(.04,t);v.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+.05)}
function click(){if(!ctx)return;const t=ctx.currentTime;[[587,.16],[1174,.03]].forEach(([f,g])=>{const o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.03);v.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+.75)})}

let P=[],i=0,el=0,last=0,run=false,lt=-1,raf,S={},yt=null,au=null,dimL=0,bgmUrl='',bgmOn=false;
function updateBgmButton(){const b=$('bgmToggle');b.textContent=bgmOn?'배경음 끄기':'배경음 켜기';b.setAttribute('aria-pressed',String(bgmOn));}
function ytId(u){try{const x=new URL(u);if(x.hostname==='youtu.be')return x.pathname.split('/').filter(Boolean)[0]?.slice(0,11)||null;const v=x.searchParams.get('v');if(v)return v.slice(0,11);const m=x.pathname.match(/\/(?:embed|shorts|live)\/([\w-]{11})/);return m?m[1]:null}catch(e){const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m&&m[1]}}
function ytList(u){const m=u.match(/[?&]list=([\w-]+)/);return m&&m[1]}
function ytCmd(f,a){try{if(yt&&yt.contentWindow)yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')}catch(e){}}
function stopBgm(){if(yt){ytCmd('pauseVideo');yt.remove();yt=null}if(au){au.pause();au.currentTime=0;au=null}bgmUrl=''}
function startBgm(url, muted=false){
 if(url===bgmUrl && (yt||au)){if(run){if(yt){ytCmd(muted?'mute':'unMute');if(!muted)ytCmd('setVolume',[100]);ytCmd('playVideo')}if(au)au.play().catch(()=>{})}return}
 stopBgm();if(!url)return;bgmUrl=url;const id=ytId(url),ls=ytList(url);
 if(id||ls){
  yt=document.createElement('iframe');
  yt.allow='autoplay; encrypted-media';
  yt.referrerPolicy='strict-origin-when-cross-origin';
  yt.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  yt.width='200';yt.height=200;yt.title='숨겨진 배경음 플레이어';
  const params=new URLSearchParams({autoplay:'1',mute:muted?'1':'0',controls:'0',loop:'1',enablejsapi:'1',playsinline:'1',rel:'0'});
  if(location.protocol==='http:'||location.protocol==='https:')params.set('origin',location.origin);
  if(ls){params.set('listType','playlist');params.set('list',ls)}else{params.set('playlist',id)}
  yt.src='https://www.youtube.com/embed/'+(ls?'videoseries':id)+'?'+params.toString();
  yt.onload=()=>{
   ytCmd(muted?'mute':'unMute');
   if(!muted)ytCmd('setVolume',[100]);
   // 숨겨진 플레이어가 준비된 뒤 재생 명령을 재전송합니다.
   setTimeout(()=>{if(!yt)return;ytCmd(muted?'mute':'unMute');if(!muted)ytCmd('setVolume',[100]);ytCmd('playVideo')},250);
   setTimeout(()=>{if(!yt)return;ytCmd('playVideo')},900);
  };
  $('bgm').appendChild(yt);
  // 플레이어가 로드되기 전 명령이 무시되는 경우를 대비해 재시도합니다.
  [300,800,1400].forEach(ms=>setTimeout(()=>{if(yt&&bgmUrl===url){if(muted)ytCmd('mute');else{ytCmd('unMute');ytCmd('setVolume',[100])}ytCmd('playVideo')}},ms));
 } else {au=new Audio(url);au.loop=true;au.volume=0;if(run)au.play().catch(()=>{});}
}
function pauseBgm(){if(yt)ytCmd('pauseVideo');if(au)au.pause()}
function resumeBgm(){if(!bgmOn)return;if(!yt&&!au){const p=P[i];if(p&&p.k==='focus')startBgm(S.fu);else if(p&&p.k==='rest')startBgm(S.ru);else if(S.fu)startBgm(S.fu,true);return}if(yt){ytCmd('unMute');ytCmd('setVolume',[100]);ytCmd('playVideo')}if(au)au.play().catch(()=>{})}
function toggleBgm(){bgmOn=!bgmOn;updateBgmButton();if(!bgmOn){stopBgm();return}if(!run)return;const p=P[i];if(p&&p.k==='focus')startBgm(S.fu);else if(p&&p.k==='rest')startBgm(S.ru);else if(S.fu)startBgm(S.fu,true)}
let vt=0;function setVol(v){v=Math.max(0,Math.min(1,v));if(au)au.volume=v;const n=performance.now();if(yt&&n-vt>200){vt=n;ytCmd('setVolume',[Math.round(v*100)])}}
function mk(){const T=S.total,f=S.focus,r=T-f;P=[{k:'ready',d:5}];for(let n=1;n<=S.reps;n++){P.push({k:'focus',d:f*60,n});P.push({k:'rest',d:r*60,n})}}
function fmt(s){s=Math.ceil(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function enter(){const p=P[i];lt=-1;document.body.classList.toggle('rest',p.k==='rest');
 $('ph').textContent=p.k==='ready'?'준비':p.k==='focus'?'🌿 집중':'☕ 휴식';
 $('st').textContent=p.k==='ready'?'곧 시작해요':p.n+' / '+S.reps+' 세트';
 if(!bgmOn){stopBgm()}else if(p.k==='focus')startBgm(S.fu);else if(p.k==='rest')startBgm(S.ru);else if(S.fu)startBgm(S.fu,true);else stopBgm()}
function loop(now){raf=requestAnimationFrame(loop);if(!run){last=now;return}
 el+=(now-last)/1000;last=now;const p=P[i];
 if(el>=p.d){click();i++;el=0;if(i>=P.length){done();return}enter();return}
 const rem=p.d-el,sec=Math.ceil(rem);
 if(sec<=5&&sec!==lt){lt=sec;tick()}
 $('tm').textContent=fmt(rem);
 $('pr').setAttribute('stroke-dasharray',(553*(1-el/p.d))+' 553');
 if(p.k!=='ready')setVol(Math.min(el/5,rem/5,1))}
function done(){cancelAnimationFrame(raf);stopBgm();bgmOn=false;updateBgmButton();$('ph').textContent='🎉 모두 끝났어요';$('tm').textContent='00:00';$('st').textContent=(S.name?S.name+'님, ':'')+'수고했어요';$('pr').setAttribute('stroke-dasharray','0 553');$('pa').style.display='none';$('en').textContent='처음으로'}
$('go').onclick=()=>{
 ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
 S={name:$('nm').value.trim(),total:total(),focus:+$('rg').value,reps,fu:$('fu').value.trim(),ru:$('ru').value.trim()};
 mk();i=0;el=0;run=true;last=performance.now();
 $('setup').style.display='none';$('timer').style.display='block';
 $('who').textContent=(S.name?S.name+'님의 ':'')+'뽀모도로';$('pa').style.display='';$('pa').textContent='일시정지';$('en').textContent='끝내기';bgmOn=false;updateBgmButton();
 enter();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)};
$('pa').onclick=()=>{run=!run;$('pa').textContent=run?'일시정지':'계속하기';if(run)resumeBgm();else pauseBgm()};
$('bgmToggle').onclick=toggleBgm;
$('en').onclick=()=>{run=false;cancelAnimationFrame(raf);stopBgm();bgmOn=false;updateBgmButton();document.body.classList.remove('rest');$('timer').style.display='none';$('setup').style.display='block';$('dim').style.opacity=0;dimL=0;$('dm').textContent='화면 어둡게'};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('dm').onclick=()=>{dimL=(dimL+1)%4;$('dim').style.opacity=[0,.35,.6,.8][dimL];$('dm').textContent=dimL===3?'밝기 원래대로':'화면 어둡게'};
// PWA: 설치 가능한 웹 앱을 위해 서비스 워커를 등록합니다.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
}
</script></body></html>
