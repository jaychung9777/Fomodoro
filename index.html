<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcebd8" id="themeColor">
<meta name="description" content="Fomodoro — 집중과 휴식을 위한 타이머">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fomodoro</title>
<style>
:root{color-scheme:light;--ink:#1d5b35;--sub:#4f8a66;--acc:#1fa24f;--acc2:#6fdc8a;--card:rgba(255,255,255,.74);--line:rgba(255,255,255,.75);--track:rgba(31,162,79,.16);--btn:#1b8f46;--pill:rgba(255,255,255,.75);--g1:#79cf86;--g2:#2f9a53;--inp:rgba(255,255,255,.7);--sh:0 10px 30px rgba(20,80,40,.16)}
html[data-theme=b]{--ink:#2b5b2c;--sub:#6a8a3c;--card:linear-gradient(160deg,rgba(255,252,222,.94),rgba(240,249,212,.9));--acc:#12a083;--acc2:#b6e24c;--track:rgba(130,170,60,.2);--btn:#1e9a45;--pill:rgba(205,236,120,.5);--g1:#a8d95e;--g2:#38a85e;--inp:rgba(255,255,255,.75)}
html[data-theme=c]{color-scheme:dark;--ink:#eaf8ee;--sub:#9fd0b0;--card:rgba(13,38,27,.88);--line:rgba(120,220,160,.2);--acc:#34d96a;--acc2:#b9f58e;--track:rgba(255,255,255,.1);--btn:#25c457;--pill:rgba(60,140,90,.35);--g1:#12402a;--g2:#061a10;--inp:rgba(0,0,0,.3);--sh:0 10px 30px rgba(0,0,0,.35)}
body.rest{--acc:#86d3a6;--acc2:#cdf1da;--btn:#74c496}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--g1),var(--g2)) fixed;color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;transition:background 1.2s;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bgsvg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#scrim{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 1.2s}
body.rest #scrim{opacity:.3}html[data-theme=c] #scrim{background:#8fe0b0}html[data-theme=c] body.rest #scrim{opacity:.12}
.wrap{position:relative;max-width:430px;margin:0 auto;padding:14px 16px 28px}
.hd{display:flex;align-items:center;gap:12px;padding:12px 6px 6px}
html[data-theme=b] .hd{background:rgba(255,255,255,.22);border-radius:22px;padding:12px 14px;backdrop-filter:blur(8px);margin-bottom:6px}
.logo{width:50px;height:50px;flex:none;color:var(--acc2);filter:drop-shadow(0 2px 4px rgba(0,60,20,.25))}
.hd b{font-size:26px;color:#fff;letter-spacing:-.3px;display:block}.hd p{margin:2px 0 0;font-size:13px;color:rgba(255,255,255,.92)}
.hd>div{flex:1;min-width:0}
.gear{width:38px;height:38px;border-radius:50%;padding:0;background:transparent;color:#fff;display:grid;place-items:center}.gear svg{width:24px;height:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px 18px;margin-bottom:14px;backdrop-filter:blur(10px);box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
.card h2 span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;margin-right:8px}
input[type=text],input[type=number],input[type=url]{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;font-size:16px}
.row{display:flex;gap:10px;align-items:center}.row label{font-size:14px;color:var(--sub)}
.t{display:flex;align-items:center;gap:6px}.t input{width:84px;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 18px;background:var(--btn);color:#fff;font-weight:600}
button.g{background:var(--pill);color:var(--ink)}
.step{width:44px;height:44px;padding:0;font-size:22px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--acc)}
.dia{display:flex;align-items:center;gap:14px}.dia svg{width:140px;flex:none}
input[type=range]{width:100%;accent-color:var(--acc)}
.sum{font-size:13px;color:#fff;text-align:center;margin:8px 0 14px}
.big{width:100%;font-size:18px;padding:16px}
small{color:var(--sub);font-size:12px}
#timer{display:none}
.main{text-align:center;padding:16px 18px 18px}
.pill{display:inline-block;background:var(--pill);color:var(--acc);font-weight:700;padding:9px 22px;border-radius:999px;font-size:17px}
#ring{width:min(66vw,260px);margin:14px auto 6px;display:block}
#tm{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}#st{font-size:14px;color:var(--sub)}
.rep{background:var(--pill);border-radius:18px;padding:10px 14px;margin:6px 0 14px}.rep .r2{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--track);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ctl{display:flex;justify-content:space-around;align-items:center}
.cb{display:flex;flex-direction:column;align-items:center;gap:6px}.cb small{color:var(--ink)}
.rb{width:58px;height:58px;padding:0;background:var(--pill);color:var(--acc);display:grid;place-items:center;box-shadow:var(--sh)}.rb svg{width:26px;height:26px}
.pb{width:88px;height:88px;padding:0;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,80,30,.3)}.pb svg{width:38px;height:38px}
html[data-theme=b] .pb{border:4px solid #fff}
.r3{display:flex;align-items:center;gap:14px;padding:14px 18px}.r3>div{flex:1}.r3 b{display:block;font-size:15px}.r3 .ic{font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--pill);display:grid;place-items:center}
.sw{width:54px;height:30px;padding:0;position:relative;background:rgba(120,130,125,.45)}.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-pressed=true]{background:var(--btn)}.sw[aria-pressed=true] i{left:27px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chips button{font-size:13px;padding:9px 14px;background:rgba(255,255,255,.28);color:#fff}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:flex;align-items:flex-end;justify-content:center}#sheet[hidden]{display:none}
.shc{width:100%;max-width:430px;background:var(--card);backdrop-filter:blur(14px);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));background-color:var(--g1)}
html[data-theme=c] .shc{background-color:#0d261b}.opts{display:grid;gap:8px;margin:12px 0}.opts button{background:var(--pill);color:var(--ink);text-align:left;border-radius:16px}.opts button.on{outline:2px solid var(--acc)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:50}
#bgm{position:fixed!important;left:-10000px!important;top:0!important;width:1px!important;height:1px!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important;z-index:-9999!important;overflow:hidden!important;clip-path:inset(50%)!important}
#bgm:empty{display:none}
#bgm iframe{position:absolute!important;left:0!important;top:0!important;display:block!important;width:1px!important;height:1px!important;border:0!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><path id="lf" d="M0 0C-12-6-16-20-7-23C-3-24 0-20 0-17C0-20 3-24 7-23C16-20 12-6 0 0Z"/><symbol id="c4" viewBox="-25 -25 50 50"><g fill="currentColor"><use href="#lf"/><use href="#lf" transform="rotate(90)"/><use href="#lf" transform="rotate(180)"/><use href="#lf" transform="rotate(270)"/></g></symbol><filter id="bl"><feGaussianBlur stdDeviation="3"/></filter><pattern id="p" width="240" height="240" patternUnits="userSpaceOnUse"><use href="#c4" x="8" y="14" width="84" height="84" style="color:#c8f09a" opacity=".5" filter="url(#bl)"/><use href="#c4" x="130" y="20" width="46" height="46" style="color:#2f8a45" opacity=".45"/><use href="#c4" x="170" y="120" width="90" height="90" style="color:#b4ea8a" opacity=".42" filter="url(#bl)"/><use href="#c4" x="30" y="140" width="56" height="56" style="color:#1f7a3a" opacity=".4"/><use href="#c4" x="110" y="150" width="34" height="34" style="color:#e8ffb8" opacity=".5"/><use href="#c4" x="90" y="80" width="26" height="26" style="color:#3d9c55" opacity=".35"/></pattern></defs></svg>
<svg id="bgsvg" aria-hidden="true"><rect width="100%" height="100%" fill="url(#p)"/></svg><div id="scrim"></div>
<div class="wrap" style="padding-bottom:0"><header class="hd"><svg class="logo"><use href="#c4"/></svg><div><b>Fomodoro</b><p id="tag">오늘도, 조금 더 집중하는 당신을 응원해요.</p></div><button class="gear" id="gear" aria-label="테마 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8" stroke-width="3.4" stroke-dasharray="3.1 3.14"/><circle cx="12" cy="12" r="5.6" stroke-width="2.4"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/></svg></button></header></div>
<div class="wrap" id="setup" style="padding-top:6px">
<div class="card"><h2><span>1</span>이름</h2><input type="text" id="nm" placeholder="이름을 입력해 주세요" maxlength="20"></div>

<div class="card"><h2><span>2</span>세트 시간</h2>
<div class="row" style="justify-content:center"><div class="t"><input type="number" id="hh" min="0" max="12" value="1" inputmode="numeric"><label>시간</label></div><div class="t"><input type="number" id="mm" min="0" max="59" step="5" value="0" inputmode="numeric"><label>분</label></div></div>
<small style="display:block;text-align:center;margin-top:8px">한 세트의 집중 + 휴식 합계 (최소 10분)</small></div>

<div class="card"><h2><span>3</span>세트 반복</h2>
<div class="row" style="justify-content:center;gap:24px"><button class="step" id="rm">−</button><div style="font-size:26px;font-weight:700;min-width:70px;text-align:center"><span id="rc">1</span> 세트</div><button class="step" id="rp">+</button></div>
<div class="dots" id="dots"></div></div>

<div class="card"><h2><span>4</span>집중 : 휴식</h2>
<div class="dia"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="62" fill="none" stroke="var(--track)" stroke-width="22"/><circle id="arc" cx="80" cy="80" r="62" fill="none" stroke="var(--acc)" stroke-width="22" transform="rotate(-90 80 80)" stroke-dasharray="0 400"/><text x="80" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor" id="dr">50:10</text><text x="80" y="98" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">집중 : 휴식</text></svg>
<div style="flex:1"><input type="range" id="rg" min="5" max="55" step="5" value="50"><div class="row" style="margin-top:8px;font-size:14px;justify-content:space-between"><div>🟢 집중 <b id="fv">50</b>분</div><div>⚪ 휴식 <b id="rv">10</b>분</div></div></div></div></div>

<div class="card"><h2><span>5</span>배경음</h2>
<div style="margin-bottom:10px"><label style="font-size:13px;color:var(--sub)">집중 시간 (YouTube 또는 음악 링크)</label><input type="url" id="fu" placeholder="https://youtu.be/..."></div>
<div><label style="font-size:13px;color:var(--sub)">휴식 시간 (YouTube 또는 음악 링크)</label><input type="url" id="ru" placeholder="https://youtu.be/..."></div>
<small style="display:block;margin-top:8px">비워 두면 해당 시간에는 배경음이 재생되지 않아요.</small></div>

<div class="sum" id="sum"></div>
<button class="big" id="go">설정 완료 · 시작하기</button>
</div>

<div class="wrap" id="timer">
<div class="card main"><div class="pill" id="ph">준비</div>
<svg id="ring" viewBox="0 0 200 200"><defs><linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--acc2)"/><stop offset="1" stop-color="var(--acc)"/></linearGradient></defs><circle cx="100" cy="100" r="88" fill="none" stroke="var(--track)" stroke-width="12"/><circle id="pr" cx="100" cy="100" r="88" fill="none" stroke="url(#rg2)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="553 553"/><foreignObject x="20" y="62" width="160" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center"><div id="tm">00:00</div><div id="st"></div></div></foreignObject></svg>
<div class="rep"><div class="r2"><span>🔁 반복 횟수</span><b id="repn">1 / 1</b></div><div class="bar"><i id="repb"></i></div></div>
<div class="ctl"><div class="cb"><button class="rb" id="rs" aria-label="초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9M20 4v5h-5"/></svg></button><small>초기화</small></div><button class="pb" id="pa"></button><div class="cb"><button class="rb" id="nx" aria-label="다음 단계"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM17 5h2.4v14H17z"/></svg></button><small>다음 단계</small></div></div></div>
<div class="card r3"><span class="ic">☕</span><div><small>다음 단계</small><b id="nxt">-</b></div></div>
<div class="card r3"><span class="ic">🎵</span><div><b>배경음악</b><small>YouTube 배경음악을 사용할 수 있습니다.</small></div><button class="sw" id="bgmToggle" aria-pressed="false" aria-label="배경음악"><i></i></button></div>
<div class="chips"><button id="en">끝내기</button><button id="fs">전체화면</button><button id="dm">화면 어둡게</button></div>
<div id="bgm" aria-hidden="true"></div></div>
<div id="sheet" hidden><div class="shc"><b>테마 선택</b><div class="opts"><button data-t="a">A · 깔끔하고 심플</button><button data-t="b">B · 감성적인 컬러 포인트</button><button data-t="c">C · 다크 모드</button></div><button class="g" id="shx" style="width:100%">닫기</button></div></div>
<div id="dim"></div>

<script>
const $=i=>document.getElementById(i);
let reps=1,ctx;
function applyTheme(t){if(!['a','b','c'].includes(t))t='a';document.documentElement.dataset.theme=t;try{localStorage.setItem('fomodoro-theme2',t)}catch(e){}const m=$('themeColor');if(m)m.content={a:'#4fb36a',b:'#9fcf6a',c:'#0b2218'}[t];document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
applyTheme(localStorage.getItem('fomodoro-theme2')||'a');
$('gear').onclick=()=>$('sheet').hidden=false;$('shx').onclick=()=>$('sheet').hidden=true;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>',PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
function setPa(){$('pa').innerHTML=run?PAUSE:PLAY;$('pa').setAttribute('aria-label',run?'일시정지':'계속하기')}
function total(){return Math.max(10,(+$('hh').value||0)*60+(+$('mm').value||0))}
function upd(){
 const T=total(),rg=$('rg');rg.max=Math.max(5,Math.floor((T-1)/5)*5);
 if(+rg.value>+rg.max)rg.value=rg.max;
 const f=+rg.value,r=T-f;$('fv').textContent=f;$('rv').textContent=r;
 $('dr').textContent=f+':'+r;
 const C=2*Math.PI*62;$('arc').setAttribute('stroke-dasharray',(C*f/T)+' '+C);
 $('rc').textContent=reps;
 $('dots').innerHTML=Array.from({length:Math.min(reps,24)},()=>'<i></i>').join('');
 const all=T*reps;$('sum').textContent='총 '+(all>=60?Math.floor(all/60)+'시간 ':'')+(all%60?all%60+'분':'')+' · '+reps+'세트';
}
['hh','mm','rg'].forEach(i=>$(i).addEventListener('input',upd));
$('rm').onclick=()=>{reps=Math.max(1,reps-1);upd()};
$('rp').onclick=()=>{reps=Math.min(99,reps+1);upd()};
upd();

function noise(t,d,fq,g,q){const n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q;const v=ctx.createGain();v.gain.value=g;s.connect(f);f.connect(v);v.connect(ctx.destination);s.start(t)}
function tone(t,fq,d,g){const o=ctx.createOscillator(),v=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(fq,t);o.frequency.exponentialRampToValueAtTime(fq*.6,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+d)}
let tk=0;function tick(){if(!ctx)return;const t=ctx.currentTime;tk^=1;noise(t,.012,tk?4200:3300,.5,6);const o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';o.frequency.value=tk?2100:1650;v.gain.setValueAtTime(.04,t);v.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+.05)}
function click(){if(!ctx)return;const t=ctx.currentTime;[[587,.16],[1174,.03]].forEach(([f,g])=>{const o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.03);v.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+.75)})}

let P=[],i=0,el=0,last=0,run=false,lt=-1,raf,S={},yt=null,au=null,dimL=0,bgmUrl='',bgmOn=false;
function updateBgmButton(){const b=$('bgmToggle');b.setAttribute('aria-pressed',String(bgmOn));}
function ytId(u){try{const x=new URL(u);if(x.hostname==='youtu.be')return x.pathname.split('/').filter(Boolean)[0]?.slice(0,11)||null;const v=x.searchParams.get('v');if(v)return v.slice(0,11);const m=x.pathname.match(/\/(?:embed|shorts|live)\/([\w-]{11})/);return m?m[1]:null}catch(e){const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m&&m[1]}}
function ytList(u){const m=u.match(/[?&]list=([\w-]+)/);return m&&m[1]}
function ytCmd(f,a){try{if(yt&&yt.contentWindow)yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')}catch(e){}}
function stopBgm(){if(yt){ytCmd('pauseVideo');yt.remove();yt=null}if(au){au.pause();au.currentTime=0;au=null}bgmUrl=''}
function startBgm(url, muted=false){
 if(url===bgmUrl && (yt||au)){if(run){if(yt){ytCmd(muted?'mute':'unMute');if(!muted)ytCmd('setVolume',[100]);ytCmd('playVideo')}if(au)au.play().catch(()=>{})}return}
 stopBgm();if(!url)return;bgmUrl=url;const id=ytId(url),ls=ytList(url);
 if(id||ls){
  yt=document.createElement('iframe');
  yt.allow='autoplay; encrypted-media';
  yt.referrerPolicy='strict-origin-when-cross-origin';
  yt.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  yt.width='200';yt.height=200;yt.title='숨겨진 배경음 플레이어';
  const params=new URLSearchParams({autoplay:'1',mute:muted?'1':'0',controls:'0',loop:'1',enablejsapi:'1',playsinline:'1',rel:'0'});
  if(location.protocol==='http:'||location.protocol==='https:')params.set('origin',location.origin);
  if(ls){params.set('listType','playlist');params.set('list',ls)}else{params.set('playlist',id)}
  yt.src='https://www.youtube.com/embed/'+(ls?'videoseries':id)+'?'+params.toString();
  yt.onload=()=>{
   ytCmd(muted?'mute':'unMute');
   if(!muted)ytCmd('setVolume',[100]);
   // 숨겨진 플레이어가 준비된 뒤 재생 명령을 재전송합니다.
   setTimeout(()=>{if(!yt)return;ytCmd(muted?'mute':'unMute');if(!muted)ytCmd('setVolume',[100]);ytCmd('playVideo')},250);
   setTimeout(()=>{if(!yt)return;ytCmd('playVideo')},900);
  };
  $('bgm').appendChild(yt);
  // 플레이어가 로드되기 전 명령이 무시되는 경우를 대비해 재시도합니다.
  [300,800,1400].forEach(ms=>setTimeout(()=>{if(yt&&bgmUrl===url){if(muted)ytCmd('mute');else{ytCmd('unMute');ytCmd('setVolume',[100])}ytCmd('playVideo')}},ms));
 } else {au=new Audio(url);au.loop=true;au.volume=0;if(run)au.play().catch(()=>{});}
}
function pauseBgm(){if(yt)ytCmd('pauseVideo');if(au)au.pause()}
function resumeBgm(){if(!bgmOn)return;if(!yt&&!au){const p=P[i];if(p&&p.k==='focus')startBgm(S.fu);else if(p&&p.k==='rest')startBgm(S.ru);else if(S.fu)startBgm(S.fu,true);return}if(yt){ytCmd('unMute');ytCmd('setVolume',[100]);ytCmd('playVideo')}if(au)au.play().catch(()=>{})}
function toggleBgm(){bgmOn=!bgmOn;updateBgmButton();if(!bgmOn){stopBgm();return}if(!run)return;const p=P[i];if(p&&p.k==='focus')startBgm(S.fu);else if(p&&p.k==='rest')startBgm(S.ru);else if(S.fu)startBgm(S.fu,true)}
let vt=0;function setVol(v){v=Math.max(0,Math.min(1,v));if(au)au.volume=v;const n=performance.now();if(yt&&n-vt>200){vt=n;ytCmd('setVolume',[Math.round(v*100)])}}
function mk(){const T=S.total,f=S.focus,r=T-f;P=[{k:'ready',d:5}];for(let n=1;n<=S.reps;n++){P.push({k:'focus',d:f*60,n});P.push({k:'rest',d:r*60,n})}}
function fmt(s){s=Math.ceil(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function enter(){const p=P[i];lt=-1;document.body.classList.toggle('rest',p.k==='rest');
 $('ph').textContent=p.k==='ready'?'준비':p.k==='focus'?'집중 시간':'휴식 시간';
 $('st').textContent=p.k==='ready'?'곧 시작해요':$('ph').textContent;
 $('repn').textContent=(p.n||1)+' / '+S.reps;
 const q=P[i+1];$('nxt').textContent=q?(q.k==='focus'?'집중 시간':'휴식 시간')+' ('+Math.round(q.d/60)+'분)':'마지막 단계예요';
 if(!bgmOn){stopBgm()}else if(p.k==='focus')startBgm(S.fu);else if(p.k==='rest')startBgm(S.ru);else if(S.fu)startBgm(S.fu,true);else stopBgm()}
function loop(now){raf=requestAnimationFrame(loop);if(!run){last=now;return}
 el+=(now-last)/1000;last=now;const p=P[i];
 if(el>=p.d){click();i++;el=0;if(i>=P.length){done();return}enter();return}
 const rem=p.d-el,sec=Math.ceil(rem);
 if(sec<=5&&sec!==lt){lt=sec;tick()}
 $('tm').textContent=fmt(rem);$('repb').style.width=(Math.max(0,i-1)+(p.k==='ready'?0:el/p.d))/(2*S.reps)*100+'%';
 $('pr').setAttribute('stroke-dasharray',(553*(1-el/p.d))+' 553');
 if(p.k!=='ready')setVol(Math.min(el/5,rem/5,1))}
function done(){cancelAnimationFrame(raf);stopBgm();bgmOn=false;updateBgmButton();$('ph').textContent='🎉 모두 끝났어요';$('tm').textContent='00:00';$('st').textContent=(S.name?S.name+'님, ':'')+'수고했어요';$('pr').setAttribute('stroke-dasharray','0 553');$('pa').style.display='none';$('en').textContent='처음으로'}
$('go').onclick=()=>{
 ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
 S={name:$('nm').value.trim(),total:total(),focus:+$('rg').value,reps,fu:$('fu').value.trim(),ru:$('ru').value.trim()};
 mk();i=0;el=0;run=true;last=performance.now();
 $('setup').style.display='none';$('timer').style.display='block';
 $('tag').textContent=(S.name?S.name+'님, ':'')+'오늘도, 조금 더 집중하는 당신을 응원해요.';$('pa').style.display='';setPa();$('en').textContent='끝내기';bgmOn=!!(S.fu||S.ru);updateBgmButton();
 enter();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)};
$('pa').onclick=()=>{run=!run;setPa();if(run)resumeBgm();else pauseBgm()};
$('bgmToggle').onclick=toggleBgm;
$('rs').onclick=()=>{el=0;lt=-1};$('nx').onclick=()=>{if(i>=P.length-1){done();return}click();i++;el=0;enter()};
$('en').onclick=()=>{run=false;cancelAnimationFrame(raf);stopBgm();bgmOn=false;updateBgmButton();document.body.classList.remove('rest');$('timer').style.display='none';$('setup').style.display='block';$('dim').style.opacity=0;dimL=0;$('dm').textContent='화면 어둡게'};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('dm').onclick=()=>{dimL=(dimL+1)%4;$('dim').style.opacity=[0,.35,.6,.8][dimL];$('dm').textContent=dimL===3?'밝기 원래대로':'화면 어둡게'};
// PWA: 설치 가능한 웹 앱을 위해 서비스 워커를 등록합니다.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
}
</script></body></html>
